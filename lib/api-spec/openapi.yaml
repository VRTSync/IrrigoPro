openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /markup-schedules/recalculate-prices/preview:
    post:
      operationId: previewMarkupRecalculation
      parameters:
        - { name: companyId, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Confirmed exact eligible population and schedule snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkupRecalculationPreview" }
        "404": { description: No active schedule }
  /markup-schedules/recalculate-prices:
    post:
      operationId: recalculateMarkupPrices
      parameters:
        - { name: companyId, in: query, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkupRecalculationInput" }
      responses:
        "200":
          description: Committed counts after at most 100 parts; continue with processed as offset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkupRecalculationResult" }
        "409": { description: Preview expired or catalog or schedule changed; preview again }
  /markup-schedules:
    parameters:
      - $ref: "#/components/parameters/MarkupCompany"
    get:
      operationId: listMarkupSchedules
      responses:
        "200":
          description: Company schedule history
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MarkupSchedule" } }
    post:
      operationId: createMarkupSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkupScheduleInput" }
      responses:
        "201":
          description: Created inactive schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkupSchedule" }
  /markup-schedules/active:
    parameters:
      - $ref: "#/components/parameters/MarkupCompany"
    get:
      operationId: getActiveMarkupSchedule
      parameters:
        - { name: customerId, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Applicable schedule with tiers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkupScheduleContext" }
        "404": { description: No active company schedule }
  /markup-schedules/options:
    parameters:
      - $ref: "#/components/parameters/MarkupCompany"
    get:
      operationId: getMarkupScheduleOptions
      responses:
        "200":
          description: Read-only schedules for contract assignment
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MarkupSchedule" } }
  /markup-schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/MarkupCompany"
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getMarkupSchedule
      responses:
        "200":
          description: Retained schedule version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkupScheduleContext" }
    put:
      operationId: updateMarkupSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkupScheduleUpdate" }
      responses:
        "200":
          description: Newly activated version, previous version retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkupSchedule" }
  /markup-schedules/{id}/activate:
    parameters:
      - $ref: "#/components/parameters/MarkupCompany"
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: activateMarkupSchedule
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkupActionResult" }
  /markup-schedules/{id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/MarkupCompany"
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: deactivateMarkupSchedule
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkupActionResult" }
  /customers/{id}/markup-override:
    parameters:
      - $ref: "#/components/parameters/MarkupCompany"
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getCustomerMarkupOverride
      responses:
        "200":
          description: Current assignment or null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkupOverrideResult" }
    put:
      operationId: setCustomerMarkupOverride
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkupOverrideInput" }
      responses:
        "200":
          description: Saved assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkupOverrideResult" }
    delete:
      operationId: removeCustomerMarkupOverride
      responses:
        "200":
          description: Company default restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkupActionResult" }
  /customers/{customerId}/controllers-profile:
    post:
      operationId: createOfflineDocumentationController
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfflineControllerInput" }
      responses:
        "201": { description: Created controller }
        "200": { description: Existing controller for this client id and parent }
        "409": { description: That client id belongs to another record }
        "404": { description: Customer not found }
  /customers/{customerId}/backflows:
    post:
      operationId: createOfflineDocumentationBackflow
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfflineBackflowInput" }
      responses:
        "201": { description: Created backflow }
        "200": { description: Existing backflow for this client id and parent }
        "409": { description: That client id belongs to another record }
        "404": { description: Customer not found }
  /irrigation-controllers/{id}/programs:
    post:
      operationId: createOfflineDocumentationProgram
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfflineProgramInput" }
      responses:
        "201": { description: Created program }
        "200": { description: Existing program for this client id and controller }
        "409": { description: That client id belongs to another record }
        "404": { description: Controller not found }
  /irrigation-controllers/{id}/zones/bulk:
    put:
      operationId: saveDocumentationZones
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentationBulkZoneInput" }
      responses:
        "200": { description: Updated current zones }
        "400": { description: "Send exactly one selector; Zone <n> isn't on Controller <letter>" }
        "404": { description: Controller or zones not found }
  /irrigation-controllers/{id}/zones/extra-programs:
    put:
      operationId: saveDocumentationZoneExtras
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentationExtraZoneInput" }
      responses:
        "200": { description: Updated current zone program lines }
        "400": { description: "Send exactly one selector; Zone <n> isn't on Controller <letter>" }
        "404": { description: Controller or zones not found }
  /irrigation-controllers/{id}/letter:
    post:
      operationId: setControllerLetter
      summary: Confirm, change or atomically swap an active controller letter
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ControllerLetterInput" }
      responses:
        "200":
          description: Saved controller and the other controller, if swapped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControllerLetterResult" }
        "400": { description: Invalid body or inactive controller }
        "401": { description: Authentication required }
        "403": { description: Forbidden }
        "404": { description: Controller not found }
        "409":
          description: Letter is held by another active controller at this location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControllerLetterConflict" }
        "500": { description: Could not save letter — please retry }
  /system-documentation/sites:
    get:
      operationId: getDocumentationSites
      summary: List privacy-safe documentation sites
      responses:
        "200":
          description: Visible customers in display-name order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentationSites" }
        "401": { description: Authentication required }
        "403": { description: Forbidden }
        "500": { description: Could not save — please retry }
  /system-documentation/customers/{customerId}/site:
    get:
      operationId: getDocumentationSite
      summary: Read one location without seeding equipment
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: branchName, in: query, schema: { type: string } }
      responses:
        "200":
          description: Active equipment, gaps, and location verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentationSite" }
        "400": { description: "Invalid customer id, Pick a location, or Unknown location" }
        "401": { description: Authentication required }
        "403": { description: Forbidden }
        "404": { description: Customer not found }
        "500": { description: Could not save — please retry }
  /irrigation-controllers/{id}/field-verify:
    post:
      operationId: fieldVerifyController
      summary: Verify a complete active controller atomically
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Updated controller row with identical verification and audit timestamps
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentationControllerVerification" }
        "400":
          description: Inactive or incomplete item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentationError" }
        "401": { description: Authentication required }
        "403": { description: Forbidden }
        "404": { description: Controller not found }
        "500": { description: Could not save — please retry }
  /backflows/{id}/field-verify:
    post:
      operationId: fieldVerifyBackflow
      summary: Verify a complete active backflow atomically
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Updated backflow row with identical verification and audit timestamps
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentationBackflowVerification" }
        "400":
          description: Inactive or incomplete item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentationError" }
        "401": { description: Authentication required }
        "403": { description: Forbidden }
        "404": { description: Backflow not found }
        "500": { description: Could not save — please retry }
  /system-documentation/customers/{customerId}/site/no-backflow:
    post:
      operationId: confirmDocumentationNoBackflow
      summary: Set the no-backflow answer and invalidate Finish when changed
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentationNoBackflowInput" }
      responses:
        "200":
          description: Derived site block
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentationSiteBlock" }
        "400":
          description: Invalid body, branch, or active backflow on file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentationError" }
        "401": { description: Authentication required }
        "403": { description: Forbidden }
        "404": { description: Customer not found }
        "500": { description: Could not save — please retry }
  /system-documentation/customers/{customerId}/site/verify:
    post:
      operationId: verifyDocumentationSite
      summary: Finish a location only after every active item is verified
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentationSiteInput" }
      responses:
        "200":
          description: Derived site block
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentationSiteBlock" }
        "400":
          description: Ordered reasons preventing Finish
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentationError" }
        "401": { description: Authentication required }
        "403": { description: Forbidden }
        "404": { description: Customer not found }
        "500": { description: Could not save — please retry }
  /quickbooks/customer-pull-status:
    get:
      operationId: getCustomerPullStatus
      summary: Read the authenticated company's QuickBooks customer pull state
      responses:
        "200":
          description: Pull state, with null fields when no integration exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPullStatus"
        "400":
          description: Company context is required
        "401":
          description: Authentication is required
        "403":
          description: QuickBooks access is required
        "500":
          description: Failed to read sync state
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    MarkupCompany:
      name: companyId
      in: query
      description: Required explicit company context for an unscoped super administrator
      schema: { type: integer, minimum: 1 }
  schemas:
    MarkupRecalculationPreview:
      type: object
      required: [confirmationToken, eligible, excluded, scheduleId, scheduleName, expiresAt]
      properties:
        confirmationToken: { type: string }
        eligible: { type: integer }
        excluded: { type: integer }
        scheduleId: { type: integer }
        scheduleName: { type: string }
        expiresAt: { type: string, format: date-time }
    MarkupRecalculationInput:
      type: object
      additionalProperties: false
      required: [confirmationToken, offset]
      properties:
        confirmationToken: { type: string, minLength: 1, maxLength: 300 }
        offset: { type: integer, minimum: 0 }
    MarkupRecalculationResult:
      type: object
      required: [processed, total, updated, unchanged, excluded, errors, done]
      properties:
        processed: { type: integer }
        total: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        excluded: { type: integer }
        errors: { type: array, items: { type: string } }
        done: { type: boolean }
    MarkupTier:
      type: object
      additionalProperties: false
      required: [tierOrder, minCost, maxCost, markupPercent]
      properties:
        tierOrder: { type: integer, minimum: 1 }
        minCost: { type: number, minimum: 0.01, maximum: 99999999.99 }
        maxCost: { type: [number, "null"], minimum: 0.01, maximum: 99999999.99 }
        markupPercent: { type: number, minimum: 0, maximum: 999.99 }
    MarkupSchedule:
      type: object
      required: [id, companyId, name, effectiveDate, isActive, createdAt, updatedAt]
      properties:
        id: { type: integer }
        companyId: { type: integer }
        name: { type: string }
        effectiveDate: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MarkupScheduleContext:
      type: object
      required: [schedule, tiers]
      properties:
        schedule: { $ref: "#/components/schemas/MarkupSchedule" }
        tiers: { type: array, items: { $ref: "#/components/schemas/MarkupTier" } }
    MarkupScheduleInput:
      type: object
      additionalProperties: false
      required: [name, effectiveDate, tiers]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        effectiveDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        tiers: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/MarkupTier" } }
    MarkupScheduleUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        tiers: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/MarkupTier" } }
    MarkupActionResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    MarkupOverrideInput:
      type: object
      additionalProperties: false
      required: [scheduleId]
      properties:
        scheduleId: { type: integer, minimum: 1 }
    MarkupOverrideResult:
      type: object
      required: [override]
      properties:
        override:
          oneOf:
            - type: "null"
            - type: object
              required: [id, companyId, customerId, scheduleId]
              properties:
                id: { type: integer }
                companyId: { type: integer }
                customerId: { type: integer }
                scheduleId: { type: integer }
    OfflineControllerInput:
      type: object
      required: [letter]
      properties:
        clientId: { type: string, format: uuid }
        letter: { type: string, pattern: "^[A-Za-z]$" }
        confirmLetter: { type: boolean }
        branchName: { type: string }
        location: { type: [string, "null"] }
        brand: { type: [string, "null"] }
        model: { type: [string, "null"] }
        totalZones: { type: [integer, "null"], minimum: 1, maximum: 100 }
        settingsPhotoUrl: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        isActive: { type: boolean }
    OfflineProgramInput:
      type: object
      required: [name]
      properties:
        clientId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        wateringDays: { type: [array, "null"], items: { type: string } }
        startTimes: { type: [array, "null"], items: { type: string } }
        seasonalAdjustPct: { type: integer, minimum: 0, maximum: 500 }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    OfflineBackflowInput:
      type: object
      required: [name]
      properties:
        clientId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        branchName: { type: string }
        brand: { type: [string, "null"] }
        model: { type: [string, "null"] }
        size: { type: [string, "null"] }
        deviceType: { type: string, enum: [rpz, double_check, pvb, spill_resistant_pvb, other] }
        serialNumber: { type: [string, "null"] }
        location: { type: [string, "null"] }
        installDate: { type: [string, "null"] }
        photoUrl: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        lastTestedDate: { type: [string, "null"] }
        nextTestDueDate: { type: [string, "null"] }
        lastTestResult: { type: [string, "null"], enum: [pass, fail, null] }
        testUnknownReason: { type: [string, "null"], enum: [never_tested, no_tag, null] }
        lastTestedBy: { type: [string, "null"] }
        isActive: { type: boolean }
    DocumentationZonePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        zoneType: { type: string, enum: [pop_up_spray, rotor, drip, netafim, bubbler, other] }
        programId: { type: [integer, "null"], minimum: 1 }
        runTimeMinutes: { type: integer, minimum: 0, maximum: 999 }
    DocumentationBulkZoneInput:
      type: object
      required: [patch]
      oneOf:
        - required: [zoneIds]
          not: { required: [zoneNumbers] }
        - required: [zoneNumbers]
          not: { required: [zoneIds] }
      properties:
        zoneIds: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: integer, minimum: 1 } }
        zoneNumbers: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: integer, minimum: 1 } }
        patch: { $ref: "#/components/schemas/DocumentationZonePatch" }
    DocumentationExtraZoneInput:
      type: object
      additionalProperties: false
      required: [zones]
      properties:
        zones:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [lines]
            oneOf:
              - required: [zoneId]
                not: { required: [zoneNumber] }
              - required: [zoneNumber]
                not: { required: [zoneId] }
            properties:
              zoneId: { type: integer, minimum: 1 }
              zoneNumber: { type: integer, minimum: 1 }
              lines:
                type: array
                maxItems: 25
                items:
                  type: object
                  additionalProperties: false
                  required: [programId, runTimeMinutes]
                  properties:
                    programId: { type: integer, minimum: 1 }
                    runTimeMinutes: { type: integer, minimum: 0, maximum: 120 }
    DocumentationSiteInput:
      type: object
      additionalProperties: false
      properties:
        branchName: { type: string }
    DocumentationNoBackflowInput:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties:
        branchName: { type: string }
        confirmed: { type: boolean }
    DocumentationGap:
      type: object
      required: [step, code, label]
      properties:
        step: { type: string }
        code: { type: string }
        label: { type: string }
    DocumentationError:
      type: object
      required: [message]
      properties:
        message: { type: string }
        gaps: { type: array, items: { $ref: "#/components/schemas/DocumentationGap" } }
        reasons: { type: array, items: { type: string } }
    DocumentationSiteStatus:
      type: string
      enum: [verified, not_verified, nothing_on_file]
    DocumentationSiteBlock:
      type: object
      required: [status, verifiedAt, verifiedByName, noBackflowConfirmed]
      properties:
        status: { $ref: "#/components/schemas/DocumentationSiteStatus" }
        verifiedAt: { type: [string, "null"], format: date-time }
        verifiedByName: { type: [string, "null"] }
        noBackflowConfirmed: { type: boolean }
    DocumentationSiteSummary:
      type: object
      required: [branchName, status, verifiedAt, controllerCount, backflowCount]
      properties:
        branchName: { type: string }
        status: { $ref: "#/components/schemas/DocumentationSiteStatus" }
        verifiedAt: { type: [string, "null"], format: date-time }
        controllerCount: { type: integer }
        backflowCount: { type: integer }
    DocumentationCustomer:
      type: object
      required: [id, name, address, branches]
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: [string, "null"] }
        branches: { type: array, items: { type: string } }
    DocumentationPickerCustomer:
      type: object
      required: [customerId, name, address, branches, sites]
      properties:
        customerId: { type: integer }
        name: { type: string }
        address: { type: [string, "null"] }
        branches: { type: array, items: { type: string } }
        sites: { type: array, items: { $ref: "#/components/schemas/DocumentationSiteSummary" } }
    DocumentationSites:
      type: object
      required: [customers]
      properties:
        customers: { type: array, items: { $ref: "#/components/schemas/DocumentationPickerCustomer" } }
    DocumentationZone:
      type: object
      required: [id, zoneNumber, name, zoneType, zoneTypeConfirmed, programId, runTimeMinutes, extraPrograms]
      properties:
        id: { type: integer }
        zoneNumber: { type: integer }
        name: { type: string }
        zoneType: { type: string }
        zoneTypeConfirmed: { type: boolean }
        programId: { type: [integer, "null"] }
        runTimeMinutes: { type: integer }
        extraPrograms:
          type: array
          items: { $ref: "#/components/schemas/ZoneExtraProgram" }
    ZoneExtraProgram:
      type: object
      required: [programId, runTimeMinutes]
      properties:
        programId: { type: integer }
        runTimeMinutes: { type: integer }
    DocumentationProgram:
      type: object
      required: [id, companyId, controllerId, name, wateringDays, startTimes, seasonalAdjustPct, isActive, sortOrder, createdAt, updatedAt]
      properties:
        clientId: { type: [string, "null"] }
        id: { type: integer }
        companyId: { type: integer }
        controllerId: { type: integer }
        name: { type: string }
        wateringDays: { type: [array, "null"], items: { type: string } }
        startTimes: { type: [array, "null"], items: { type: string } }
        seasonalAdjustPct: { type: integer }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ControllerLetterInput:
      type: object
      additionalProperties: false
      required: [letter]
      properties:
        letter: { type: string, pattern: "^[A-Za-z]$" }
        confirm: { type: boolean }
        swap: { type: boolean }
    ControllerLetterRecord:
      type: object
      additionalProperties: true
      required: [id, letter, name, letterConfirmed, location]
      properties:
        id: { type: integer }
        letter: { type: [string, "null"] }
        name: { type: string }
        letterConfirmed: { type: boolean }
        location: { type: [string, "null"] }
    ControllerLetterResult:
      type: object
      required: [controller, swappedWith]
      properties:
        controller: { $ref: "#/components/schemas/ControllerLetterRecord" }
        swappedWith:
          oneOf:
            - { $ref: "#/components/schemas/ControllerLetterRecord" }
            - { type: "null" }
    ControllerLetterConflict:
      type: object
      required: [message, holder]
      properties:
        message: { type: string }
        holder:
          type: object
          required: [id, letter, location]
          properties:
            id: { type: integer }
            letter: { type: [string, "null"] }
            location: { type: [string, "null"] }
    DocumentationController:
      type: object
      required: [id, letter, letterConfirmed, name, location, brand, model, totalZones, settingsPhotoUrl, notes, lastUpdatedAt, fieldVerifiedAt, fieldVerifiedByName, gaps, verified]
      properties:
        id: { type: integer }
        letter: { type: [string, "null"] }
        letterConfirmed: { type: boolean }
        name: { type: string }
        location: { type: [string, "null"] }
        brand: { type: [string, "null"] }
        model: { type: [string, "null"] }
        totalZones: { type: [integer, "null"] }
        settingsPhotoUrl: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        lastUpdatedAt: { type: [string, "null"], format: date-time }
        fieldVerifiedAt: { type: [string, "null"], format: date-time }
        fieldVerifiedByName: { type: [string, "null"] }
        gaps: { type: array, items: { $ref: "#/components/schemas/DocumentationGap" } }
        verified: { type: boolean }
    DocumentationControllerGraph:
      allOf:
        - { $ref: "#/components/schemas/DocumentationController" }
        - type: object
          required: [programs, zones]
          properties:
            clientId: { type: [string, "null"] }
            programs: { type: array, items: { $ref: "#/components/schemas/DocumentationProgram" } }
            zones: { type: array, items: { $ref: "#/components/schemas/DocumentationZone" } }
    DocumentationEquipmentAudit:
      type: object
      required: [isActive, lastUpdatedByUserId, lastUpdatedByName, lastUpdatedAt, fieldVerifiedByUserId, fieldVerifiedByName, fieldVerifiedAt, createdAt, updatedAt]
      properties:
        isActive: { type: boolean }
        lastUpdatedByUserId: { type: [integer, "null"] }
        lastUpdatedByName: { type: [string, "null"] }
        lastUpdatedAt: { type: [string, "null"], format: date-time }
        fieldVerifiedByUserId: { type: [integer, "null"] }
        fieldVerifiedByName: { type: [string, "null"] }
        fieldVerifiedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DocumentationEquipmentOwner:
      type: object
      required: [companyId, customerId, branchName]
      properties:
        companyId: { type: integer }
        customerId: { type: integer }
        branchName: { type: string }
    DocumentationControllerVerification:
      allOf:
        - { $ref: "#/components/schemas/DocumentationController" }
        - { $ref: "#/components/schemas/DocumentationEquipmentAudit" }
        - { $ref: "#/components/schemas/DocumentationEquipmentOwner" }
    DocumentationBackflow:
      allOf:
        - { $ref: "#/components/schemas/DocumentationEquipmentAudit" }
        - type: object
          required: [id, branchName, name, brand, model, size, deviceType, serialNumber, location, installDate, photoUrl, notes, lastTestedDate, nextTestDueDate, lastTestResult, lastTestedBy, testUnknownReason, gaps, verified]
          properties:
            clientId: { type: [string, "null"] }
            id: { type: integer }
            branchName: { type: string }
            name: { type: string }
            brand: { type: [string, "null"] }
            model: { type: [string, "null"] }
            size: { type: [string, "null"] }
            deviceType: { type: string }
            serialNumber: { type: [string, "null"] }
            location: { type: [string, "null"] }
            installDate: { type: [string, "null"] }
            photoUrl: { type: [string, "null"] }
            notes: { type: [string, "null"] }
            lastTestedDate: { type: [string, "null"] }
            nextTestDueDate: { type: [string, "null"] }
            lastTestResult: { type: [string, "null"] }
            lastTestedBy: { type: [string, "null"] }
            testUnknownReason: { type: [string, "null"] }
            gaps: { type: array, items: { $ref: "#/components/schemas/DocumentationGap" } }
            verified: { type: boolean }
    DocumentationBackflowVerification:
      allOf:
        - { $ref: "#/components/schemas/DocumentationBackflow" }
        - { $ref: "#/components/schemas/DocumentationEquipmentOwner" }
        - type: object
          required: [vrtSyncId]
          properties:
            vrtSyncId: { type: [string, "null"] }
    DocumentationSite:
      type: object
      required: [customer, branchName, controllers, backflows, site]
      properties:
        customer: { $ref: "#/components/schemas/DocumentationCustomer" }
        branchName: { type: string }
        controllers: { type: array, items: { $ref: "#/components/schemas/DocumentationControllerGraph" } }
        backflows: { type: array, items: { $ref: "#/components/schemas/DocumentationBackflow" } }
        site: { $ref: "#/components/schemas/DocumentationSiteBlock" }
    CustomerPullStatus:
      type: object
      required: [intervalMinutes, lastAttemptAt, lastSuccessAt, lastError, lastSummary]
      properties:
        intervalMinutes:
          type: integer
          enum: [15]
        lastAttemptAt:
          type: [string, "null"]
          format: date-time
        lastSuccessAt:
          type: [string, "null"]
          format: date-time
        lastError:
          type: [string, "null"]
        lastSummary:
          oneOf:
            - $ref: "#/components/schemas/CustomerPullSummary"
            - type: "null"
    CustomerPullSummary:
      type: object
      required: [mode, added, updated, unchanged, heldForReview, skippedDeleted, hiddenByQuickbooks, unhiddenByQuickbooks, unmappedTerms]
      properties:
        mode:
          type: string
          enum: [incremental, full, manual]
        added:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        heldForReview:
          type: integer
        skippedDeleted:
          type: integer
        hiddenByQuickbooks:
          type: integer
        unhiddenByQuickbooks:
          type: integer
        unmappedTerms:
          type: array
          items:
            type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

